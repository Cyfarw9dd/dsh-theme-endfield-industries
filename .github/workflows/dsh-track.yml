name: DSH Compatibility Radar

# 纯信号，不发版：监测 @deepseek-ai/dsh（npm 官方源）的 latest / next 通道，
#   1. 有「比记录更新」的版本 → 安装它，跑契约漂移探针 + 完整测试套件（validate）
#   2. 全绿 → 只把 .github/dsh-track.json 的验证记录推上 main（record）
#   3. 有红 → 报警（红任务 + ::error 注解 + 失败通知），记录不落盘，
#      修复后下一次运行自动重试（report）
# 版本号是主题自己的 semver（0.3.0 起），发版走 release.yml；
# 「对齐 DSH 版本」发生在 release.yml 的探针与 Release notes 里，不在这里。
# 设计与操作细节：docs/cookbook/dsh-version-tracking.md

on:
  schedule:
    # 每 3 天一次（2026-10-28 定档：上游 next 通道几天才发一版，高频只剩
    # 空调用与 npm/runner 抖动带来的误报暴露面）。UTC 01:37 = 北京上午 9:37，
    # 早上看结果；分钟错开整点（GitHub 整点 cron 拥堵）。
    # day-of-month 步进按 1,4,7...31 取值，月末 31→次日 1 会出现一次约
    # 2 天的短间隔（更早跑，不会更晚），无害。
    - cron: '37 1 */3 * *'
  workflow_dispatch:
    inputs:
      dsh_version:
        description: '手动指定要验证的 @deepseek-ai/dsh 版本（如 0.2.1-alpha.1；留空则自动监测）'
        required: false
        default: ''

# 串行：同一时刻最多一个雷达运行，避免两个版本同时验证互相顶。
concurrency:
  group: dsh-track
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # 探测：对比 npm dist-tags 与已验证记录。纯查询，不装包不跑测试。
  # ---------------------------------------------------------------------------
  detect:
    name: 探测版本变化
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.resolve.outputs.changed }}
      version: ${{ steps.resolve.outputs.version }}
      channel: ${{ steps.resolve.outputs.channel }}
      distTags: ${{ steps.resolve.outputs.distTags }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - id: resolve
        env:
          MANUAL_VERSION: ${{ github.event.inputs.dsh_version }}
        run: |
          if [ -n "$MANUAL_VERSION" ]; then
            # 手动入口：不查 dist-tags（验证 alpha 等未进通道的版本时用），
            # 但仍取一份快照放进验证记录，便于审计“当时各通道在哪”。
            tags="$(npm view @deepseek-ai/dsh dist-tags --json --prefer-online)"
            echo "changed=true"        >> "$GITHUB_OUTPUT"
            echo "version=$MANUAL_VERSION" >> "$GITHUB_OUTPUT"
            echo "channel=manual"      >> "$GITHUB_OUTPUT"
            dist="$(node -e 'console.log(JSON.stringify(JSON.parse(require("fs").readFileSync(0,"utf8"))))' <<<"$tags")"
            echo "distTags=$dist"      >> "$GITHUB_OUTPUT"
            echo "手动验证 $MANUAL_VERSION（dist-tags: $dist）"
            exit 0
          fi

          json="$(node .github/scripts/dsh-track.js --check)"
          echo "$json"
          node -e '
            const j = JSON.parse(process.argv[1])
            const out = `changed=${j.changed}\nversion=${j.version ?? ""}\nchannel=${j.channel ?? ""}\ndistTags=${JSON.stringify(j.distTags)}\n`
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, out)
          ' "$json"

      - name: 无变化时给个明确摘要
        if: steps.resolve.outputs.changed != 'true'
        run: echo '未发现新版本，本次运行到此为止。' >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 验证：安装目标版本 → 漂移探针（对真实 bundle 的契约检查）→ 完整测试套件。
  # 与 ci.yml 的 test job 同构（同样的 Chrome 定位与 file:// 冒烟检查），
  # 区别是测试跑在“新 DSH 已安装”的语境之后，探针红即本 job 红。
  # ---------------------------------------------------------------------------
  validate:
    name: 验证 @deepseek-ai/dsh@${{ needs.detect.outputs.version }}
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 安装目标版 DSH
        env:
          DSH_VERSION: ${{ needs.detect.outputs.version }}
        run: |
          npm install --prefix "$RUNNER_TEMP/dsh-tree" \
            --omit=dev --ignore-scripts --no-audit --no-fund \
            "@deepseek-ai/dsh@$DSH_VERSION"
          got="$(node -p "require('$RUNNER_TEMP/dsh-tree/node_modules/@deepseek-ai/dsh/package.json').version")"
          if [ "$got" != "$DSH_VERSION" ]; then
            echo "::error title=安装版本不符::要求 $DSH_VERSION，装上的是 $got"
            exit 1
          fi
          echo "已安装 @deepseek-ai/dsh@$got"

      # 与 ci.yml 的 test job 同构：test:ci 以 scripts/build-client.js --check
      # 开头（产物新鲜度门禁），tsdown 等 devDependencies 必须先就位。本 job
      # 曾漏装依赖：2026-10-23 起三次验证全部红在 tsdown 上（漂移探针本身
      # 零依赖，所以红得很晚才暴露）。
      - name: 安装构建依赖
        run: npm install --no-audit --no-fund

      - name: 契约漂移探针
        run: |
          set -o pipefail
          node .github/scripts/dsh-drift-probe.js "$RUNNER_TEMP/dsh-tree/node_modules/@deepseek-ai" 2>&1 | tee probe.log

      - name: 定位 Chrome
        run: |
          p="$(command -v google-chrome || command -v google-chrome-stable \
            || command -v chromium-browser || command -v chromium || true)"
          if [ -z "$p" ]; then
            echo "::error title=环境缺失::runner 上找不到 Chrome/Chromium，浏览器测试无法运行"
            exit 1
          fi
          echo "CHROME_PATH=$p" >> "$GITHUB_ENV"
          echo "使用 $p"

      # 与 ci.yml 相同的冒烟检查：这批测试用 'file:///' + 绝对路径 拼 URL，
      # 该拼法的 Linux 行为要先探一次，否则失败会是一堆神秘的红。
      - name: headless Chrome 冒烟检查
        run: |
          tmp="$(mktemp -d)"
          printf '<!doctype html><title>SMOKE-OK</title>' > "$tmp/probe.html"
          dom="$("$CHROME_PATH" --headless=new --disable-gpu --no-sandbox \
            --user-data-dir="$(mktemp -d)" --dump-dom "file:///$tmp/probe.html" 2>/dev/null || true)"
          case "$dom" in
            *SMOKE-OK*) echo "ok    headless Chrome 冒烟通过" ;;
            *) echo "::error title=file URL 拼法在 Linux 上失效::见 ci.yml 同名步骤的说明"; exit 1 ;;
          esac

      - name: 完整测试套件
        run: |
          set -o pipefail
          node .github/scripts/run-tests.js test:ci 2>&1 | tee suite.log

      - name: 摘要
        if: always()
        run: |
          {
            echo "## DSH ${{ needs.detect.outputs.version }} 验证（${{ needs.detect.outputs.channel }} 通道）"
            echo ''
            echo '```text'
            tail -n 5 probe.log 2>/dev/null || true
            tail -n 3 suite.log 2>/dev/null || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ---------------------------------------------------------------------------
  # 记录：验证全绿后只把 .github/dsh-track.json 推上 main（发版在 release.yml）。
  # 提交身份是 github-actions[bot]；提交信息走 Conventional Commits。
  # ---------------------------------------------------------------------------
  record:
    name: 记录 DSH ${{ needs.detect.outputs.version }} 验证通过
    needs: [detect, validate]
    if: needs.detect.outputs.changed == 'true' && needs.validate.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: 落盘验证记录（不碰 package.json）
        env:
          DSH_VERSION: ${{ needs.detect.outputs.version }}
          DIST_TAGS: ${{ needs.detect.outputs.distTags }}
        run: node .github/scripts/dsh-track.js --record "$DSH_VERSION" --dist-tags "$DIST_TAGS"

      - name: 提交记录文件并推送
        env:
          DSH_VERSION: ${{ needs.detect.outputs.version }}
          CHANNEL: ${{ needs.detect.outputs.channel }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          if git diff --quiet; then
            echo '记录文件无变更（内容已是目标值）——跳过提交。'
            exit 0
          fi
          # 只提交记录文件：雷达不产生任何其他工作树变更；显式列名让意外变更在 diff 里一眼可见。
          {
            echo "chore(track): record @deepseek-ai/dsh@$DSH_VERSION validated"
            echo ''
            echo "- Contract drift probe + full test suite all green (found via the $CHANNEL channel)"
            echo "- Validation run: $RUN_URL"
          } > commit-msg.txt
          git add .github/dsh-track.json
          git commit -F commit-msg.txt
          git push origin HEAD:main

  # ---------------------------------------------------------------------------
  # 报警：验证有红时记录不落盘，把失败打到任务页与通知里——**不开 issue**
  # （2026-10-18 所有者指定；仓库 Issues 功能也处于关闭状态，旧的
  # 「开/关追踪 issue」机制在 Issues 关闭的仓库上只会让 workflow 无谓染红）。
  # 报警通道是 GitHub 自带的：定时任务失败时，GitHub 会给「最后编辑过
  # workflow 文件的用户」发失败通知，::error 注解随任务页与通知一起出现；
  # 失败日志截尾收进本步骤 Summary。记录文件**不**更新——下一次运行会
  # 重试同一版本，主题修复后自动补发。
  # ---------------------------------------------------------------------------
  report:
    name: 报警 DSH 版本验证失败
    needs: [detect, validate]
    # !cancelled() 必须显式写：if 里不含任何状态检查函数时 GitHub 会隐式包一层
    # success()，validate 一红本 job 就被整体 skip——2026-10-23~24 的三连红里
    # 报警一次都没发出去，就是它（详见 docs/cookbook/dsh-version-tracking.md）。
    if: ${{ !cancelled() && needs.detect.outputs.changed == 'true' && needs.validate.result == 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - name: 汇总失败并报警
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DSH_VERSION: ${{ needs.detect.outputs.version }}
          CHANNEL: ${{ needs.detect.outputs.channel }}
          DIST_TAGS: ${{ needs.detect.outputs.distTags }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # 失败步骤的日志（探针/套件输出都在里面），截尾防超长。
          gh run view "$GITHUB_RUN_ID" --log-failed > failed-full.log 2>/dev/null || true
          tail -c 8000 failed-full.log > failed.log || true

          {
            echo "## DSH \`$DSH_VERSION\` 契约验证失败，记录未落盘"
            echo ''
            echo "- 发现渠道: \`$CHANNEL\` · dist-tags: \`${DIST_TAGS}\`"
            echo "- 验证运行: $RUN_URL"
            echo ''
            echo '失败探针/测试套件输出（截尾）:'
            echo ''
            echo '```text'
            if [ -s failed.log ]; then cat failed.log; else echo '(日志拉取失败——打开上面的运行链接看)'; fi
            echo '```'
            echo ''
            echo '<sub>处理指引: docs/compatibility.md（新版本适配流程）；'
            echo '退役钩子豁免清单: .github/scripts/dsh-drift-probe.js 顶部。</sub>'
          } >> "$GITHUB_STEP_SUMMARY"

          # ::error 注解：任务页红条 + 失败通知里都带它，最后退出 1 让本任务红。
          echo "::error title=DSH $DSH_VERSION 验证失败::新版本破坏了主题契约，验证已拦截。失败摘要见本步骤 Summary，完整日志：$RUN_URL"
          exit 1
